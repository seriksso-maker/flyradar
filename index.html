<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyradar by steinar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: fullskjerm mørkt kart, flytende verktøylinje øverst, detaljpanel til høyre (bunnark på mobil) */
  :root{
    --bg:#0a1017; --panel:rgba(12,19,27,.94); --line:#1e2b39; --fg:#dbe6ef; --mute:#7b8fa3;
    --amber:#ffb454; --cyan:#59d0ff; --ok:#4fd18b; --bad:#ff6b6b;
    --ui:'Barlow',system-ui,sans-serif; --cond:'Barlow Condensed','Barlow',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui)}
  #map{position:absolute;inset:0;background:var(--bg)}
  .leaflet-container{font-family:var(--ui)}
  .leaflet-control-attribution{background:rgba(10,16,23,.7)!important;color:var(--mute)!important}
  .leaflet-control-attribution a{color:var(--mute)!important}

  .bar{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
  .bar>*{pointer-events:auto}
  .brand{font:700 20px var(--cond);letter-spacing:.03em;padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
  .brand .by{font:500 14px var(--ui);letter-spacing:0;color:var(--mute);margin-left:2px}
  .brand b{color:var(--amber);font-weight:700}
  input[type=search],select,button{font:500 14px var(--ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:36px;box-sizing:border-box}
  input[type=search]{width:220px;max-width:100%}
  button{cursor:pointer}
  button:hover,select:hover{border-color:var(--mute)}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
  .chk{display:flex;align-items:center;gap:6px;padding:0 10px;min-height:36px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;user-select:none}

  .status{position:absolute;z-index:500;left:12px;bottom:28px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font:12px var(--mono);display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 100px)}
  .status .row{display:flex;align-items:center;gap:8px}
  #dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
  #dot.ok{background:var(--ok)} #dot.load{background:var(--amber)} #dot.err{background:var(--bad)}
  .ramp{height:6px;border-radius:3px;background:linear-gradient(90deg,hsl(30,90%,60%),hsl(115,90%,60%),hsl(200,90%,60%))}
  .ramp-l{display:flex;justify-content:space-between;color:var(--mute);font-size:10px}

  aside{position:absolute;z-index:600;top:60px;right:12px;width:330px;max-height:calc(100% - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
  aside[hidden]{display:none}
  .ph{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .call{font:700 32px/1 var(--cond);letter-spacing:.04em}
  .sub{color:var(--mute);margin-top:4px;font-size:13px}
  .x{border:0;background:none;font-size:22px;line-height:1;padding:2px 8px;min-height:0;color:var(--mute)}
  .route{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .route .ap{font:600 26px var(--cond);letter-spacing:.05em}
  .route .arrow{color:var(--amber);flex:none}
  .route small{display:block;color:var(--mute);font:400 11px var(--ui);letter-spacing:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .grid div{background:var(--panel);padding:10px 14px}
  .grid label{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .grid span{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
  .grid em{font:400 11px var(--ui);font-style:normal;color:var(--mute);margin-left:4px}
  .hd{position:relative;display:flex;border-bottom:1px solid var(--line)}
  .hl{flex:1;min-width:0;padding:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font:600 12px var(--ui);padding:2px 7px;border-radius:5px;background:#3a4450;color:#e6eef5}
  .chip.blue{background:#14609e;color:#fff}
  .chip.red{background:#b3261e;color:#fff}
  .air{margin-top:8px;font:500 17px/1.25 var(--ui)}
  .pic{position:relative;width:42%;min-height:100px;flex:none;background:#10202e}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .pic small{position:absolute;left:6px;bottom:4px;font-size:10px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
  .hd .x{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(10,16,23,.65);color:#fff;font-size:20px}
  .rt2{padding:12px 14px;border-bottom:1px solid var(--line)}
  .rp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .rp>div:last-child{text-align:right}
  .rp .rc{font:600 30px/1 var(--cond);letter-spacing:.05em}
  .rp small{display:block;margin-top:2px;color:var(--mute);font:400 11px var(--ui);text-transform:uppercase;letter-spacing:.04em}
  .rp .arrow{color:var(--amber)}
  .prog{height:4px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--amber)}
  .bl{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--mute);font-size:12px}
  .grid .wide{grid-column:1/-1}
  .acts{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .acts button{flex:1;border:0;border-radius:0;background:var(--panel);padding:10px 4px;color:var(--mute);font-weight:600}
  .acts button.on{color:var(--amber)}
  .leaflet-tooltip.rt{background:var(--panel);color:#cdbbff;border:1px solid var(--line);box-shadow:none;font:600 11px var(--mono);padding:2px 5px}
  .leaflet-tooltip-top.rt::before{border-top-color:var(--line)}
  #cock{position:absolute;inset:0;z-index:900;background:linear-gradient(#3f7fc4 0%,#9cc7e8 45%,#d6e4ec 52%,#5d6b57 53%)}
  #cmap{position:absolute;inset:0}
  .cframe{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ctop{position:absolute;z-index:3;left:calc(8% + 6px);top:calc(7% + 4px);display:flex;flex-direction:column;gap:2px;font:500 12px var(--mono);color:#fff;text-shadow:0 0 4px #000,0 0 4px #000}
  .ctop b{font:700 22px var(--cond);letter-spacing:.05em}
  .chud{position:absolute;z-index:3;left:0;right:0;bottom:0;height:22%;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 3%;gap:4px}
  .chud div{text-align:center;min-width:0}
  .chud label{display:block;color:#7b8fa3;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
  .chud span{font:500 17px var(--mono);color:#ffb454;font-variant-numeric:tabular-nums}
  .cattr{position:absolute;z-index:3;right:6px;bottom:3px;font-size:9px;color:#5f7284}
  .cmsg{position:absolute;z-index:4;left:50%;top:40%;transform:translateX(-50%);padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;text-align:center;max-width:80%}
  #cclose{position:absolute;z-index:5;top:12px;right:12px}
  #air{min-width:190px;max-width:100%}
  #air.on{border-color:var(--amber);color:var(--amber)}
  .photo{display:block;width:100%;max-height:150px;object-fit:cover;border-bottom:1px solid var(--line)}
  .note{padding:10px 14px;color:var(--mute);font-size:12px}

  .plane{background:none;border:0}
  .pl{position:relative;width:28px;height:28px}
  .pl svg{width:28px;height:28px;display:block;filter:drop-shadow(0 0 2px #000)}
  .pl.gnd svg{opacity:.5}
  .pl.sel::before{content:"";position:absolute;inset:-3px;border:1.5px solid var(--amber);border-radius:50%}
  .pl img.lg{display:none;position:absolute;right:-9px;top:-9px;width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid #0a1017;object-fit:contain}
  #map.logos .pl img.lg{display:block}
  .call img.big{width:28px;height:28px;border-radius:50%;background:#fff;vertical-align:-5px;margin-right:8px;object-fit:contain}
  .lb{display:none;position:absolute;left:27px;top:7px;font:500 11px var(--mono);color:#cfe3f3;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;pointer-events:none}
  #map.labels .lb{display:block}
  .ap{position:relative;width:10px;height:10px}
  .ap i{position:absolute;inset:0;border:2px solid #9fd8ff;background:#0a1017;border-radius:2px;transform:rotate(45deg)}
  .ap b{display:none;position:absolute;left:13px;top:-3px;font:500 10px var(--mono);color:#9fd8ff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
  #map.aplab .ap b{display:block}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  .leaflet-popup-content{font:14px/1.4 var(--ui);margin:10px 14px}
  .leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
  .home{width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid #0a1017;box-shadow:0 0 0 2px var(--amber)}

  @media (max-width:640px){
    aside{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:55%}
    .status{bottom:auto;top:auto;left:8px;bottom:calc(8px + 0px)}
    aside:not([hidden]) ~ .status{display:none}
    input[type=search]{width:150px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <div class="brand">Fly<b>radar</b> <span class="by">by steinar</span></div>
  <select id="air" aria-label="Flyselskap"><option value="">Alle flyselskap</option></select>
  <input id="q" type="search" placeholder="Søk callsign, reg, type" autocomplete="off" aria-label="Søk etter fly">
  <label class="chk"><input id="aps" type="checkbox" checked> Flyplasser</label>
  <select id="mapType" aria-label="Karttype"></select>
  <select id="src" aria-label="Datakilde">
    <option value="adsb">adsb.lol</option>
    <option value="airplanes">airplanes.live</option>
    <option value="adsbfi">adsb.fi</option>
    <option value="opensky">OpenSky</option>
  </select>
  <button id="diag" type="button">Test</button>
</div>

<aside id="panel" hidden></aside>
<aside id="diagp" hidden style="z-index:700"></aside>

<div id="cock" hidden>
  <div id="cmap"></div>
  <svg class="cframe" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a323c"/><stop offset="1" stop-color="#0c1015"/></linearGradient></defs>
    <path fill="#0c1015" fill-rule="evenodd" d="M0 0H100V100H0Z M7 7 Q50 2 93 7 L97 76 H3 Z"/>
    <rect x="48.7" y="3" width="2.6" height="73" fill="#0c1015"/>
    <rect x="0" y="73.5" width="100" height="3.5" fill="url(#gs)"/>
  </svg>
  <div class="ctop"><b id="hCall"></b><span id="hRoute"></span></div>
  <div class="chud">
    <div><label>Fart</label><span id="hSpd">–</span></div>
    <div><label>Kurs</label><span id="hHdg">–</span></div>
    <div><label>Høyde</label><span id="hAlt">–</span></div>
    <div><label>Stigning</label><span id="hVs">–</span></div>
  </div>
  <div class="cattr">Bilder: Esri World Imagery · Terreng: AWS/Mapzen</div>
  <div id="cmsg" class="cmsg" hidden></div>
  <button id="cclose" type="button">Tilbake til kart</button>
</div>

<div class="status">
  <div class="row"><i id="dot"></i><span id="stat">Laster …</span></div>
  <div><div class="ramp"></div><div class="ramp-l"><span>0 ft</span><span>20 000</span><span>40 000 ft</span></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  function getJSON(url, signal){
    return fetch(url, {signal:signal}).then(function(r){

  var lastHint = '', lastTiles = 1;
  function normAdsb(j){
    return (j.ac||j.aircraft||[]).filter(function(a){ return a.lat!=null && a.lon!=null; }).map(function(a){
      return {
        hex:a.hex, call:(a.flight||'').trim(), reg:a.r||'', type:a.t||'',
        lat:a.lat, lon:a.lon, ground:a.alt_baro==='ground',
        alt: typeof a.alt_baro==='number' ? a.alt_baro : (typeof a.alt_geom==='number' ? a.alt_geom : null),
        gs: a.gs==null?null:a.gs, trk: a.track!=null?a.track:(a.true_heading||0),
        vr: a.baro_rate!=null?a.baro_rate:(a.geom_rate!=null?a.geom_rate:null),
        squawk:a.squawk||'', ias:a.ias!=null?a.ias:null, mach:a.mach!=null?a.mach:null,
        altg:typeof a.alt_geom==='number'?a.alt_geom:null, cat:a.category||''
      };
    });
  }

  // Kildene gir maks 250 nm radius per forespørsel. For store kartutsnitt (Europa) deles utsnittet i flere sirkler.
  function tilesFor(max){
    var c = map.getCenter(), b = map.getBounds();
    var viewNm = c.distanceTo(b.getNorthEast())/1852;
    if(viewNm <= 250) return {tiles:[[c.lat, c.lng, Math.round(Math.max(10, viewNm))]], cut:false};
    var R = 240, side = R*1.852*Math.SQRT2, dLat = side/111.2, tiles = [];
    for(var la = b.getSouth()+dLat/2; la < b.getNorth()+dLat/2; la += dLat){
      var cl = Math.max(0.2, Math.cos(Math.min(Math.abs(la),80)*Math.PI/180)), dLon = side/(111.2*cl);
      for(var lo = b.getWest()+dLon/2; lo < b.getEast()+dLon/2; lo += dLon) tiles.push([la, lo, R]);
    }
    var k = Math.cos(c.lat*Math.PI/180);
    tiles.sort(function(x,y){ return Math.hypot(x[0]-c.lat,(x[1]-c.lng)*k) - Math.hypot(y[0]-c.lat,(y[1]-c.lng)*k); });
    var MAX = max || 1;
    return {tiles:tiles.slice(0, MAX), cut:tiles.length > MAX};
  }

  // Kjører oppgaver med maks n samtidig, så gratis proxyer ikke blir overbelastet
  function pool(items, n, fn){
    return new Promise(function(res){
      var i = 0, active = 0;
      function next(){
        if(i>=items.length && active===0) return res();
        while(active<n && i<items.length){
          active++;
          fn(items[i++]).then(done, done);
        }
      }
      function done(){ active--; next(); }
      next();
    });
  }

  // maxTiles: 1 for gratis offentlige kilder (skånsomt), flere for lokal server
  function adsbSource(name, urlFn, maxTiles){
    return function(signal, probe){
      var t = tilesFor(maxTiles||1), tiles = probe ? [t.tiles[0]] : t.tiles;
      var okCount = 0, lastErr = null, aborted = null, byHex = {}, fb = false;
      function one(x){
        return getJSON(urlFn(x[0].toFixed(3), x[1].toFixed(3), x[2]), signal).then(function(j){
          okCount++;
          normAdsb(j).forEach(function(a){ if(a.hex) byHex[a.hex] = a; });
        }).catch(function(e){ if(e.name==='AbortError') aborted = e; else lastErr = e; });
      }
      return pool(tiles, 3, one).then(function(){
        if(aborted) throw aborted;
        if(!okCount && tiles.length>1){   // alle flisene feilet: prøv bare midten av kartet
          var c = map.getCenter(); fb = true;
          return one([c.lat, c.lng, 240]);
        }
      }).then(function(){
        if(aborted) throw aborted;
        if(!okCount) throw lastErr || new Error('ingen svar');
        if(!probe){
          lastTiles = fb ? 1 : tiles.length;
          lastHint = fb ? ' · bare midten (kilden begrenser)' : (t.cut ? (maxTiles>1 ? ' · zoom inn for flere fly' : ' · kun midten av kartet (egen proxy gir hele Europa)') : (okCount<tiles.length ? ' · delvis dekning' : ''));
        }
        return Object.keys(byHex).map(function(h){ return byHex[h]; });
      });
    };
  }

  function fetchOpenSky(signal){
    var b = map.getBounds();
    var lamin = Math.max(-90,b.getSouth()), lamax = Math.min(90,b.getNorth());
    var lomin = Math.max(-180,b.getWest()), lomax = Math.min(180,b.getEast());
    var url = 'https://opensky-network.org/api/states/all?lamin='+lamin.toFixed(3)+'&lomin='+lomin.toFixed(3)+'&lamax='+lamax.toFixed(3)+'&lomax='+lomax.toFixed(3);
    return getJSON(url, signal).then(function(j){
      return (j.states||[]).filter(function(s){ return s[5]!=null && s[6]!=null; }).map(function(s){
        var altM = s[13]!=null ? s[13] : s[7];
        return {
          hex:s[0], call:(s[1]||'').trim(), reg:'', type:'',
          lat:s[6], lon:s[5], ground:!!s[8],
          alt: altM!=null ? altM*3.28084 : null,
          gs: s[9]!=null ? s[9]*1.94384 : null, trk: s[10]!=null?s[10]:0,
          vr: s[11]!=null ? s[11]*196.85 : null, squawk:s[14]||''

    });
  }

  /* ---------- Tegning ---------- */
  function altColor(d){
    if(d.ground) return '#7b8fa3';

  }

  function matches(d){

  // Ytelse: bare fly i kartutsnittet får markør, ikon bygges kun om når utseendet endres, og det er tak på antall markører
  var viewB = map.getBounds().pad(0.15), MAXMARK = window.innerWidth<700 ? 500 : 1200, budget = MAXMARK;
  function refreshView(){
    viewB = map.getBounds().pad(0.15);
    var n = 0; planes.forEach(function(p){ if(p.marker && p.marker._map) n++; });
    budget = Math.max(0, MAXMARK - n);
  }

  function iconKey(d, selected, z){
    return Math.round((d.trk||0)/5)+'|'+(d.ground?'g':Math.round((d.alt||0)/1000))+'|'+(selected?1:0)+'|'+(z>=6?1:0)+'|'+(z>=8?(d.call||d.hex):'');
  }
  function iconFor(d, selected, z){
    var html = '<div class="pl'+(selected?' sel':'')+(d.ground?' gnd':'')+'" style="color:'+altColor(d)+'">'
      + '<svg viewBox="0 0 24 24" style="transform:rotate('+Math.round(d.trk||0)+'deg)" fill="currentColor"><path d="'+PLANE_PATH+'"/></svg>'
      + (z>=6 ? logoHtml(d,'lg') : '')
      + (z>=8 ? '<span class="lb">'+esc(d.call||d.hex)+'</span>' : '')
      + '</div>';
    return L.divIcon({className:'plane', html:html, iconSize:[28,28], iconAnchor:[14,14]});
  }

  function draw(hex){
    var p = planes.get(hex); if(!p) return;
    var d = p.d, onMap = p.marker && p.marker._map;
    var show = matches(d) && (hex===sel || viewB.contains([d.lat, d.lon]));
    if(!show){ if(onMap) p.marker.remove(); return; }
    var z = map.getZoom(), selected = hex===sel, key = iconKey(d, selected, z);
    if(!p.marker){
      if(budget<=0) return;
      budget--;
      p.marker = L.marker([d.lat,d.lon], {icon:iconFor(d,selected,z), keyboard:false});
      p.ikey = key;
      p.marker.on('click', function(e){ L.DomEvent.stopPropagation(e); select(hex); });
    } else {
      if(!onMap){ if(budget<=0) return; budget--; }
      p.marker.setLatLng([d.lat,d.lon]);
      if(p.ikey!==key){ p.marker.setIcon(iconFor(d, selected, z)); p.ikey = key; }
    }
    if(!p.marker._map) p.marker.addTo(map);
  }

  function apply(list){
    var now = performance.now(), seen = new Set();
    refreshView();
    list.forEach(function(a){
      if(!a.hex) return;
      seen.add(a.hex);
      var p = planes.get(a.hex);
      if(!p){ p = {trail:[]}; planes.set(a.hex, p); }
      p.d = a; p.seen = now; p.t0 = now; p.lat0 = a.lat; p.lon0 = a.lon;
      var last = p.trail[p.trail.length-1];
      if(!last || last[0]!==a.lat || last[1]!==a.lon){ p.trail.push([a.lat,a.lon]); if(p.trail.length>80) p.trail.shift(); }
      draw(a.hex);
    });
    Array.from(planes.keys()).forEach(function(hex){
      if(seen.has(hex) || now - planes.get(hex).seen < 60000) return;
      var p = planes.get(hex);
      if(p.marker) p.marker.remove();
      planes.delete(hex);
    });
    refreshAirOptions();
    if(sel){
      var s = planes.get(sel);
      trailLine.setLatLngs(s ? s.trail : []);
      renderPanel();
    }
  }

  function visibleCount(){

  // Gjetter posisjon mellom oppdateringer så flyene beveger seg jevnt
  setInterval(function(){
    var now = performance.now();
    planes.forEach(function(p){
      var d = p.d;
      if(!p.marker || !p.marker._map || d.ground || !(d.gs>30)) return;
      var dt = Math.min((now-p.t0)/1000, 30);
      var m = d.gs*0.514444*dt, r = (d.trk||0)*Math.PI/180;
      p.marker.setLatLng([p.lat0 + m*Math.cos(r)/111320, p.lon0 + m*Math.sin(r)/(111320*Math.cos(p.lat0*Math.PI/180))]);
    });
    if(follow && sel){
      var fp = planes.get(sel);
      if(fp && fp.marker){ progPan = true; map.panTo(fp.marker.getLatLng(), {animate:false}); progPan = false; }
    }
  }, 1000);

  /* ---------- Detaljpanel ---------- */
  function fl(d){
    if(d.ground) return 'På bakken';
    if(d.alt==null) return '–';
    return d.alt>=6000 ? 'FL'+String(Math.round(d.alt/100)).padStart(3,'0') : nb(Math.round(d.alt/50)*50)+' ft';
  }

  var showRoute = true, follow = false, more = false, routeDrawn = '', progPan = false;
  var routeLayer = L.layerGroup().addTo(map);

  function km(a, b, c, d){
    var R = 6371, t = Math.PI/180, dLa = (c-a)*t, dLo = (d-b)*t;
    var h = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(a*t)*Math.cos(c*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function gcPoints(a, b, c, d, n){
    var t = Math.PI/180, la1 = a*t, lo1 = b*t, la2 = c*t, lo2 = d*t;
    var dd = 2*Math.asin(Math.sqrt(Math.pow(Math.sin((la2-la1)/2),2) + Math.cos(la1)*Math.cos(la2)*Math.pow(Math.sin((lo2-lo1)/2),2)));
    if(!dd) return [[a,b],[c,d]];
    var out = [];
    for(var i=0; i<=n; i++){
      var f = i/n, A = Math.sin((1-f)*dd)/Math.sin(dd), B = Math.sin(f*dd)/Math.sin(dd);
      var x = A*Math.cos(la1)*Math.cos(lo1) + B*Math.cos(la2)*Math.cos(lo2);
      var y = A*Math.cos(la1)*Math.sin(lo1) + B*Math.cos(la2)*Math.sin(lo2);
      var z = A*Math.sin(la1) + B*Math.sin(la2);
      out.push([Math.atan2(z, Math.sqrt(x*x+y*y))/t, Math.atan2(y, x)/t]);
    }
    return out;
  }
  function hm(h){ var m = Math.max(0, Math.round(h*60)); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

  // Planlagt rute (stiplet lilla linje) mellom avgang og ankomst
  function drawRoute(r){
    var ok = r && r.origin && r.destination && r.origin.latitude!=null && r.destination.latitude!=null && showRoute;
    var key = ok ? sel+'|'+(r.callsign_icao||'') : '';
    if(key===routeDrawn) return;
    routeDrawn = key; routeLayer.clearLayers();
    if(!ok) return;
    var o = r.origin, t = r.destination;
    L.polyline(gcPoints(o.latitude, o.longitude, t.latitude, t.longitude, 64), {color:'#a78bfa', weight:2, opacity:.9, dashArray:'6 6', interactive:false}).addTo(routeLayer);
    [o, t].forEach(function(x){
      L.circleMarker([x.latitude, x.longitude], {radius:5, color:'#a78bfa', weight:2, fillColor:'#0a1017', fillOpacity:1, interactive:false})
        .bindTooltip(esc(x.iata_code||x.icao_code||''), {permanent:true, direction:'top', className:'rt'}).addTo(routeLayer);
    });
  }

  function emergency(sq){ return {'7700':'Nødsignal 7700', '7600':'Radiosvikt 7600', '7500':'Kapring 7500'}[sq] || ''; }
  function cell(l, v, cls){ return '<div'+(cls?' class="'+cls+'"':'')+'><label>'+l+'</label><span>'+v+'</span></div>'; }

  function renderPanel(){
    var el = $('#panel');
    if(!sel){ el.hidden = true; return; }
    var p = planes.get(sel);
    el.hidden = false;
    var st = el.scrollTop;
    if(!p){
      el.innerHTML = '<div class="ph"><div><div class="call">'+esc(sel.toUpperCase())+'</div><div class="sub">Signalet er borte</div></div><button class="x" id="close" aria-label="Lukk">×</button></div>';

    }

    drawRoute(r);

    var airline = (r && r.airline && r.airline.name) || AIRLINES[airOf(d)] || (a && a.registered_owner) || '';
    var fno = r && r.callsign_iata ? r.callsign_iata : '';

    var route = '';
    if(r && (o.iata_code || o.icao_code || t.iata_code || t.icao_code)){
      var prog = '';
      if(o.latitude!=null && t.latitude!=null){
        var flown = km(o.latitude, o.longitude, d.lat, d.lon), left = km(d.lat, d.lon, t.latitude, t.longitude);
        var pct = Math.max(0, Math.min(100, 100*flown/Math.max(1, flown+left)));
        var eta = '';
        if(!d.ground && d.gs > 100){
          var h = left/(d.gs*1.852);
          eta = ' · ca. '+new Date(Date.now()+h*3600000).toLocaleTimeString('nb-NO', {hour:'2-digit', minute:'2-digit'})+' (om '+hm(h)+')';
        }
        prog = '<div class="prog"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
          + '<div class="bl"><span>Fløyet '+nb(flown)+' km</span><span>Igjen '+nb(left)+' km'+eta+'</span></div>';
      }
      route = '<div class="rt2"><div class="rp">'
        + '<div><div class="rc">'+esc(o.iata_code||o.icao_code||'?')+'</div><small>'+esc(o.municipality||o.name||'')+'</small></div>'
        + '<svg class="arrow" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M14 6l6 6-6 6"/></svg>'
        + '<div><div class="rc">'+esc(t.iata_code||t.icao_code||'?')+'</div><small>'+esc(t.municipality||t.name||'')+'</small></div>'
        + '</div>'+prog+'</div>';
    }

    var acName = a ? [a.manufacturer, a.type].filter(Boolean).join(' ') : '';
    var vr = d.vr==null ? '–' : (d.vr>0?'+':'')+nb(d.vr);
    var grid = '<div class="grid">'
      + cell('Høyde', esc(fl(d)) + (d.alt!=null && !d.ground ? '<em>'+nb(d.alt*0.3048)+' m</em>' : ''))

      + cell('Kurs', Math.round(d.trk||0)+'°')

      + cell('Fly', esc(acName || d.type || '–'), 'wide')

      + '</div>';

    var extra = '';
    if(more){
      extra = '<div class="grid">'
        + cell('Squawk', esc(d.squawk || '–'))

        + cell('IAS', d.ias!=null ? nb(d.ias)+'<em>kt</em>' : '–')
        + cell('Mach', d.mach!=null ? d.mach.toFixed(2) : '–')
        + cell('Kategori', esc(d.cat || '–'))
        + cell('ICAO-type', esc(tcode || '–'))

        + cell('Eierland', esc((a && a.registered_owner_country_name) || '–'), 'wide')
        + '</div>'
        + '<div class="note">Rute og flyinfo fra adsbdb.com og gjelder callsignet, ikke alltid dagens faktiske rute. Ankomsttid er estimert fra avstand og fart.</div>';
    }

    el.innerHTML =
      '<div class="hd"><div class="hl"><div class="call">'+logoHtml(d,'big')+esc(d.call||d.hex.toUpperCase())+'</div>'
      + (chips ? '<div class="chips">'+chips+'</div>' : '')
      + '<div class="air">'+esc(airline || d.reg || '')+'</div></div>'+photo
      + '<button class="x" id="close" aria-label="Lukk">×</button></div>'
      + route + grid + extra
      + '<div class="acts"><button id="bRoute" type="button" class="'+(showRoute?'on':'')+'">Rute</button>'
      + '<button id="bCock" type="button">Cockpit</button>'
      + '<button id="bMore" type="button" class="'+(more?'on':'')+'">Mer info</button>'
      + '<button id="bFollow" type="button" class="'+(follow?'on':'')+'">Følg</button></div>';

    $('#close').onclick = function(){ select(null); };
    $('#bRoute').onclick = function(){ showRoute = !showRoute; renderPanel(); };
    $('#bCock').onclick = openCockpit;
    $('#bMore').onclick = function(){ more = !more; renderPanel(); };
    $('#bFollow').onclick = function(){
      follow = !follow;
      if(follow && p.marker){ progPan = true; map.setView(p.marker.getLatLng(), Math.max(map.getZoom(), 8), {animate:false}); progPan = false; }
      renderPanel();
    };
    el.scrollTop = st;
  }

  function lookup(d){
    var jobs = [];
    if(d.call && !cache.route.has(d.call)){
      cache.route.set(d.call, null);
      jobs.push(getJSON('https://api.adsbdb.com/v0/callsign/'+encodeURIComponent(d.call)).then(function(j){
        cache.route.set(d.call, (j.response && j.response.flightroute) || false);
      }).catch(function(){ cache.route.set(d.call, false); }));
    }
    if(!cache.ac.has(d.hex)){
      cache.ac.set(d.hex, null);
      jobs.push(getJSON('https://api.adsbdb.com/v0/aircraft/'+encodeURIComponent(d.hex)).then(function(j){
        cache.ac.set(d.hex, (j.response && j.response.aircraft) || false);
      }).catch(function(){ cache.ac.set(d.hex, false); }));
    }
    if(jobs.length) Promise.all(jobs).then(renderPanel);
  }

  function select(hex){
    var old = sel; sel = hex;
    if(old) draw(old);
    if(hex){
      draw(hex);
      var p = planes.get(hex);
      trailLine.setLatLngs(p ? p.trail : []);
      if(p) lookup(p.d);
    } else {
      trailLine.setLatLngs([]);
      follow = false; more = false; routeDrawn = ''; routeLayer.clearLayers(); closeCockpit();
    }
    renderPanel();
  }
  map.on('click', function(){ if(sel) select(null); });

  /* ---------- Cockpit-visning (3D terreng sett fra flyet) ---------- */
  var cockOn = false, cmap = null, cockRaf = 0, mlLoading = null, cockHdg = 0, cockLast = 0, hudLast = 0;

  function loadMapLibre(){
    if(window.maplibregl) return Promise.resolve();
    if(mlLoading) return mlLoading;
    mlLoading = new Promise(function(res, rej){
      var l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css'; document.head.appendChild(l);
      var sc = document.createElement('script');
      sc.src = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js';
      sc.onload = res;
      sc.onerror = function(){ mlLoading = null; rej(new Error('Kunne ikke laste 3D-biblioteket. Sjekk internett.')); };
      document.head.appendChild(sc);
    });
    return mlLoading;
  }

  function planePos(p){
    var d = p.d;
    if(d.ground || !(d.gs>30)) return [p.lat0, p.lon0];
    var dt = Math.min((performance.now()-p.t0)/1000, 30), m = d.gs*0.514444*dt, r = (d.trk||0)*Math.PI/180;
    return [p.lat0 + m*Math.cos(r)/111320, p.lon0 + m*Math.sin(r)/(111320*Math.cos(p.lat0*Math.PI/180))];
  }
  function angDiff(a, b){ return ((b-a+540)%360)-180; }

  function openCockpit(){
    var p = planes.get(sel);
    if(!p) return;
    $('#cock').hidden = false; cockOn = true;
    cockHdg = p.d.trk || 0;
    var msg = $('#cmsg'); msg.textContent = 'Laster 3D-kart …'; msg.hidden = false;
    $('#hCall').textContent = p.d.call || p.d.hex.toUpperCase();
    var r = p.d.call ? cache.route.get(p.d.call) : null;
    $('#hRoute').textContent = r && r.origin && r.destination ? (r.origin.iata_code||'')+' → '+(r.destination.iata_code||'') : '';
    loadMapLibre().then(function(){
      if(!cockOn) return;
      if(!cmap){
        cmap = new maplibregl.Map({
          container:'cmap', interactive:false, attributionControl:false, fadeDuration:0,
          center:[p.lon0, p.lat0], zoom:9, pitch:80, maxPitch:85,
          style:{
            version:8,
            sources:{
              sat:{type:'raster', tileSize:256, maxzoom:18, tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']},
              dem:{type:'raster-dem', tileSize:256, maxzoom:14, encoding:'terrarium', tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png']}
            },
            layers:[{id:'sat', type:'raster', source:'sat'}],
            terrain:{source:'dem', exaggeration:1}
          }
        });
        try{ cmap.transform.fov = 60; }catch(e){}
      } else { cmap.resize(); }
      msg.hidden = true;
      cockLoop(performance.now());
    }).catch(function(e){ msg.textContent = e.message; });
  }

  function closeCockpit(){
    cockOn = false;
    cancelAnimationFrame(cockRaf);
    var c = $('#cock'); if(c) c.hidden = true;
  }

  function cockLoop(ts){
    if(!cockOn) return;
    cockRaf = requestAnimationFrame(cockLoop);
    if(ts - cockLast < 33) return;   // ca. 30 bilder i sekundet
    cockLast = ts;
    var p = planes.get(sel), msg = $('#cmsg');
    if(!p){ msg.textContent = 'Signalet fra flyet er borte'; msg.hidden = false; return; }
    msg.hidden = true;
    var d = p.d, pos = planePos(p);
    cockHdg = (cockHdg + angDiff(cockHdg, d.trk||0)*0.06 + 360) % 360;
    var altM = Math.max(25, (d.ground ? 0 : (d.alt||0))*0.3048 + 4);
    // Synsvinkel: litt nedover mot horisonten, mer ved nedstigning
    var gamma = (d.gs>50 && d.vr!=null) ? Math.atan((d.vr*0.00508)/(d.gs*0.514444))*180/Math.PI : 0;
    var dip = 5 + Math.max(0, -gamma)*1.5;
    var dist = Math.min(150000, Math.max(3000, altM/Math.tan(dip*Math.PI/180)));
    var h = cockHdg*Math.PI/180;
    var tgt = [pos[1] + dist*Math.sin(h)/(111320*Math.cos(pos[0]*Math.PI/180)), pos[0] + dist*Math.cos(h)/111320];
    try{
      var cam = cmap.getFreeCameraOptions();
      cam.position = maplibregl.MercatorCoordinate.fromLngLat([pos[1], pos[0]], altM);
      cam.lookAtPoint(tgt);
      cmap.setFreeCameraOptions(cam);
    }catch(e){}
    if(ts - hudLast > 250){
      hudLast = ts;
      $('#hSpd').textContent = d.gs==null ? '–' : nb(d.gs)+' kt';
      $('#hHdg').textContent = String(Math.round(d.trk||0)).padStart(3,'0')+'°';
      $('#hAlt').textContent = d.ground ? 'Bakke' : (d.alt==null ? '–' : nb(d.alt)+' ft');
      $('#hVs').textContent = d.vr==null ? '–' : (d.vr>0?'+':'')+nb(d.vr);
    }
  }
  $('#cclose').addEventListener('click', closeCockpit);

  /* ---------- Oppdateringsløkke ---------- */
  // Én enkelt oppdateringsløkke: hver ny runde avbryter den forrige, og gamle svar ignoreres (gen)
  var timer = null, ctrl = null, fails = 0, gen = 0, picking = false, probeCtrls = [], diagShown = false;
  function setStat(kind, text){
    $('#dot').className = kind;
    $('#stat').textContent = text;
  }
  function schedule(fn, ms){ clearTimeout(timer); timer = setTimeout(fn, ms); }
  function cancelAll(){
    gen++; clearTimeout(timer);
    if(ctrl){ ctrl.abort(); ctrl = null; }
    probeCtrls.forEach(function(c){ c.abort(); }); probeCtrls = [];
    picking = false;
  }

  function tick(){
    if(picking) return;
    if(document.hidden){ schedule(tick, 2000); return; }
    cancelAll();
    var my = gen;
    ctrl = new AbortController();
    setStat('load', 'Henter fra '+SRC[src].label+' …');
    SRC[src].fetch(ctrl.signal).then(function(list){
      if(my!==gen) return;
      apply(list); fails = 0;
      setStat('ok', visibleCount()+' fly · '+new Date().toLocaleTimeString('nb-NO')+lastHint);
      schedule(tick, SRC[src].every + (lastTiles>1 ? lastTiles*600 : 0));
    }).catch(function(e){
      if(my!==gen) return;
      fails++;
      var msg = e.message==='Failed to fetch' ? 'ingen kontakt (blokkert/CORS/nett)' : e.message;
      if(fails>=2){ fails = 0; autoPick(); return; }
      setStat('err', SRC[src].label+': '+msg);
      schedule(tick, 2500);
    });
  }

  // Prøver alle kilder samtidig (ett kall hver) og bruker den første som svarer
  function autoPick(){
    cancelAll();
    picking = true;
    var my = gen, left = ORDER.length, done = false;
    setStat('load', 'Leter etter fungerende kilde …');
    ORDER.forEach(function(k){
      var c = new AbortController(); probeCtrls.push(c);
      var t = setTimeout(function(){ c.abort(); }, 12000);
      SRC[k].fetch(c.signal, true).then(function(list){
        clearTimeout(t);
        if(my!==gen || done) return;
        done = true; picking = false;
        probeCtrls.forEach(function(x){ x.abort(); }); probeCtrls = [];
        src = k; $('#src').value = k; fails = 0;
        $('#diagp').hidden = true;
        apply(list);
        setStat('ok', SRC[k].label+' · '+visibleCount()+' fly · '+new Date().toLocaleTimeString('nb-NO'));
        schedule(tick, 300);
      }).catch(function(){
        clearTimeout(t);
        if(my!==gen || done) return;
        if(--left===0){
          picking = false;
          setStat('err', 'Ingen kilde svarte. Trykk Test, eller bruk flyradar_server.py. Prøver igjen om 20 s.');
          if(!diagShown){ diagShown = true; runDiag(); }
          schedule(autoPick, 20000);
        }
      });
    });
  }

  var moveT = null;
  map.on('moveend', function(){
    if(progPan) return;
    redrawAll();
    clearTimeout(moveT);
    moveT = setTimeout(function(){ if(!picking) tick(); }, 1000);
  });
  map.on('dragstart', function(){ if(follow){ follow = false; renderPanel(); } });
  function labels(){ mapEl.classList.toggle('labels', map.getZoom()>=8); mapEl.classList.toggle('logos', map.getZoom()>=6); }
  map.on('zoomend', labels); labels();
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && !picking) tick(); });

  /* ---------- Diagnose ---------- */
  function withTimeout(url, opts, ms){

    return fetch(url, opts).then(function(r){ clearTimeout(t); return r; }, function(e){ clearTimeout(t); throw e; });
  }

      + '<div class="note"><b style="color:var(--fg)">Egen proxy (anbefalt, gir stabil drift)</b><br>Lim inn adressen til din Cloudflare Worker:<br>'

      delete SRC.mine; ORDER = ORDER.filter(function(k){ return k!=='mine'; });
      addMine(); src = ORDER[0]; buildSrcSelect();
      $('#pxMsg').textContent = v ? (saved ? 'Lagret' : 'Brukes nå (nettleseren lar ikke siden huske den)') : 'Fjernet';
      planes.forEach(function(p){ if(p.marker) p.marker.remove(); }); planes.clear();
      fails = 0; autoPick();
    };
    tests.forEach(function(t){
      var row = document.createElement('div'); row.className = 'note'; row.textContent = t[0]+': tester …';
      $('#dres').appendChild(row);
      withTimeout(t[1], {}, 10000).then(function(r){
        row.textContent = t[0]+': '+(r.ok ? 'OK' : 'svarer, men feil')+' (HTTP '+r.status+')';
        row.style.color = r.ok ? '#4fd18b' : '#ffb454';
      }).catch(function(){
        return withTimeout(t[1], {mode:'no-cors'}, 10000).then(function(){
          row.textContent = t[0]+': tjenesten nås, men CORS blokkerer'; row.style.color = '#ffb454';
        }, function(e2){
          row.textContent = t[0]+': ingen forbindelse ('+(e2.name==='AbortError'?'tidsavbrudd':e2.message)+')'; row.style.color = '#ff6b6b';
        });
      });
    });
  }
  $('#diag').addEventListener('click', runDiag);

  /* ---------- Kontroller ---------- */
  function redrawAll(){
    refreshView();
    planes.forEach(function(p,hex){ draw(hex); });
    if($('#dot').className==='ok') setStat('ok', SRC[src].label+' · '+visibleCount()+' fly · '+new Date().toLocaleTimeString('nb-NO')+lastHint);
  }
  $('#air').addEventListener('change', function(e){
    airSel = e.target.value; airSig = ''; e.target.className = airSel ? 'on' : '';
    redrawAll();
  });
  $('#aps').addEventListener('change', function(e){ showAps = e.target.checked; updateAirports(); });
  $('#q').addEventListener('input', function(e){ filter = e.target.value.trim().toLowerCase(); redrawAll(); });
  $('#src').addEventListener('change', function(e){
    src = e.target.value;
    planes.forEach(function(p){ if(p.marker) p.marker.remove(); });
    planes.clear(); select(null); fails = 0; tick();
  });

  autoPick();
})();
</script>
</body>
</html>
