<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flyradar by steinar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: fullskjerm mørkt kart, flytende verktøylinje øverst, detaljpanel til høyre (bunnark på mobil) */
  :root{
    --bg:#0a1017; --panel:rgba(12,19,27,.94); --line:#1e2b39; --fg:#dbe6ef; --mute:#7b8fa3;
    --amber:#ffb454; --cyan:#59d0ff; --ok:#4fd18b; --bad:#ff6b6b;
    --ui:'Barlow',system-ui,sans-serif; --cond:'Barlow Condensed','Barlow',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui)}
  #map{position:absolute;inset:0;background:var(--bg)}
  .leaflet-container{font-family:var(--ui)}
  .leaflet-control-attribution{background:rgba(10,16,23,.7)!important;color:var(--mute)!important}
  .leaflet-control-attribution a{color:var(--mute)!important}

  input[type=search],select,button{font:500 14px var(--ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:36px;box-sizing:border-box}
  input[type=search]{width:220px;max-width:100%}
  button{cursor:pointer}
  button:hover,select:hover{border-color:var(--mute)}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
  .chk{display:flex;align-items:center;gap:6px;padding:0 10px;min-height:36px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;user-select:none}

  .status{position:absolute;z-index:500;left:12px;bottom:28px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font:12px var(--mono);display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 100px)}
  .status .row{display:flex;align-items:center;gap:8px}
  #dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
  #dot.ok{background:var(--ok)} #dot.load{background:var(--amber)} #dot.err{background:var(--bad)}
  .ramp{height:6px;border-radius:3px;background:linear-gradient(90deg,hsl(30,90%,60%),hsl(115,90%,60%),hsl(200,90%,60%))}
  .ramp-l{display:flex;justify-content:space-between;color:var(--mute);font-size:10px}

  aside{position:absolute;z-index:600;top:60px;right:12px;width:330px;max-height:calc(100% - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
  aside[hidden]{display:none}
  .ph{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .call{font:700 32px/1 var(--cond);letter-spacing:.04em}
  .sub{color:var(--mute);margin-top:4px;font-size:13px}
  .x{border:0;background:none;font-size:22px;line-height:1;padding:2px 8px;min-height:0;color:var(--mute)}
  .route{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .route .ap{font:600 26px var(--cond);letter-spacing:.05em}
  .route .arrow{color:var(--amber);flex:none}
  .route small{display:block;color:var(--mute);font:400 11px var(--ui);letter-spacing:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .grid div{background:var(--panel);padding:10px 14px}
  .grid label{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .grid span{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
  .grid em{font:400 11px var(--ui);font-style:normal;color:var(--mute);margin-left:4px}
  .hd{position:relative;display:flex;border-bottom:1px solid var(--line)}
  .hl{flex:1;min-width:0;padding:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font:600 12px var(--ui);padding:2px 7px;border-radius:5px;background:#3a4450;color:#e6eef5}
  .chip.blue{background:#14609e;color:#fff}
  .chip.red{background:#b3261e;color:#fff}
  .air{margin-top:8px;font:500 17px/1.25 var(--ui)}
  .pic{position:relative;width:42%;min-height:100px;flex:none;background:#10202e}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .pic small{position:absolute;left:6px;bottom:4px;font-size:10px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
  .hd .x{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(10,16,23,.65);color:#fff;font-size:20px}
  .rt2{padding:12px 14px;border-bottom:1px solid var(--line)}
  .rp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .rp>div:last-child{text-align:right}
  .rp .rc{font:600 30px/1 var(--cond);letter-spacing:.05em}
  .rp small{display:block;margin-top:2px;color:var(--mute);font:400 11px var(--ui);text-transform:uppercase;letter-spacing:.04em}
  .rp .arrow{color:var(--amber)}
  .prog{height:4px;background:var(--line);border-radius:2px;margin-top:12px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--amber)}
  .bl{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--mute);font-size:12px}
  .grid .wide{grid-column:1/-1}
  .acts{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .acts button{flex:1;border:0;border-radius:0;background:var(--panel);padding:10px 4px;color:var(--mute);font-weight:600}
  .acts button.on{color:var(--amber)}
  .leaflet-tooltip.rt{background:var(--panel);color:#cdbbff;border:1px solid var(--line);box-shadow:none;font:600 11px var(--mono);padding:2px 5px}
  .leaflet-tooltip-top.rt::before{border-top-color:var(--line)}
  #cock{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:2000;background:#8fb4d8;overflow:hidden;touch-action:none}
  #sky{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;z-index:2100;background:#06101a;overflow:hidden}
  #skyv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #skyc{position:absolute;left:0;top:0}
  #skyinfo{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));max-width:60%;font:500 12px var(--mono);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;z-index:3}
  #skyclose{position:absolute;z-index:5;top:calc(10px + env(safe-area-inset-top));right:10px}
  #skyadj{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:4px 8px;background:rgba(10,16,23,.7);border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--mute)}
  #skyadj button{padding:2px 12px;min-height:30px}
  #sky .cmsg{z-index:4;top:40%}
  #cmap{position:absolute;inset:0}
  #cmap canvas{outline:none}
  #cpit{position:absolute;left:0;top:0;pointer-events:none}
  .cattr{position:absolute;z-index:3;left:8px;top:6px;font-size:9px;color:rgba(255,255,255,.7);text-shadow:0 0 3px #000}
  .cmsg{position:absolute;z-index:4;left:50%;top:30%;transform:translateX(-50%);padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;text-align:center;max-width:80%}
  #chint{position:absolute;z-index:4;left:50%;top:14%;transform:translateX(-50%);padding:8px 12px;background:rgba(10,16,23,.85);border:1px solid var(--line);border-radius:6px;font-size:13px;text-align:center}
  #cclose{position:absolute;z-index:5;top:10px;right:10px}
  #air{min-width:190px;max-width:100%}
  #air.on{border-color:var(--amber);color:var(--amber)}
  .photo{display:block;width:100%;max-height:150px;object-fit:cover;border-bottom:1px solid var(--line)}
  .note{padding:10px 14px;color:var(--mute);font-size:12px}

  .plane{background:none;border:0}
  .pl{position:relative;width:28px;height:28px}
  .pl svg{width:28px;height:28px;display:block;filter:drop-shadow(0 0 2px #000)}
  .pl.gnd svg{opacity:.5}
  .pl.sel::before{content:"";position:absolute;inset:-3px;border:1.5px solid var(--amber);border-radius:50%}
  .pl img.lg{display:none;position:absolute;right:-9px;top:-9px;width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid #0a1017;object-fit:contain}
  #map.logos .pl img.lg{display:block}
  .call img.big{width:28px;height:28px;border-radius:50%;background:#fff;vertical-align:-5px;margin-right:8px;object-fit:contain}
  .lb{display:none;position:absolute;left:27px;top:7px;font:500 11px var(--mono);color:#cfe3f3;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;pointer-events:none}
  #map.labels .lb{display:block}
  .ap{position:relative;width:10px;height:10px}
  .ap i{position:absolute;inset:1px;background:#ff3b30;border:1px solid rgba(0,0,0,.55);border-radius:50%}
  .ap b{display:none;position:absolute;left:12px;top:-4px;font:600 10px var(--mono);color:#ff9d96;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
  #map.aplab .ap b{display:block}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  .leaflet-popup-content{font:14px/1.4 var(--ui);margin:10px 14px}
  .leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
  .home{width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid #0a1017;box-shadow:0 0 0 2px var(--amber)}


  /* Toppfelt, bunnmeny og ark (som i flightradar24) */
  .top{position:absolute;z-index:500;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 10px;background:rgba(18,26,34,.92);border-bottom:1px solid var(--line);border-radius:0 0 14px 14px;display:flex;flex-direction:column;gap:8px;max-width:560px;box-sizing:border-box}
  .top .r1{display:flex;gap:8px;align-items:center}
  .badge{flex:none;width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 16px var(--cond);letter-spacing:.02em}
  .badge b{color:var(--amber)}
  .sbox{flex:1;position:relative;min-width:0}
  .sbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8a98a6;pointer-events:none}
  .sbox input{width:100%!important;padding-left:38px;min-height:40px;background:#eef1f3;color:#22303c;border:0;border-radius:8px;font-size:15px}
  .sbox input::placeholder{color:#7d8b97}
  #air{width:100%;min-width:0}
  .dock{position:absolute;z-index:500;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(calc(100% - 20px),520px);display:flex;justify-content:space-around;padding:8px 6px 6px;background:rgba(18,26,34,.94);border:1px solid var(--line);border-radius:28px}
  .dock button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#e8eef3;font:500 13px var(--ui);padding:4px 8px;min-height:0;flex:1}
  .dock button.on{color:var(--amber)}
  .dock svg{display:block}
  .fab{position:absolute;z-index:500;left:12px;bottom:calc(92px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(60,70,78,.88);border:0;color:#e8eef3}
  .sheet{position:absolute;z-index:550;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));width:min(calc(100% - 20px),520px);max-height:50%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;box-sizing:border-box}
  .sheet[hidden]{display:none}
  .sheet h3{margin:0 0 10px;font:600 16px var(--ui)}
  .sheet label{display:block;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px}
  .sheet select{width:100%}
  .chips2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chips2 button{padding:10px 8px;text-align:center}
  .chips2 button.on{border-color:var(--amber);color:var(--amber)}
  .dock{bottom:calc(6px + env(safe-area-inset-bottom));padding:3px 4px;border-radius:22px;background:rgba(18,26,34,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.12)}
  .dock button{font-size:10.5px;gap:1px;padding:2px 6px}
  .dock svg{width:21px;height:21px}
  .fab{width:42px;height:42px;bottom:calc(66px + env(safe-area-inset-bottom));background:rgba(60,70,78,.6)}
  .sheet{bottom:calc(64px + env(safe-area-inset-bottom))}
  .leaflet-bottom{bottom:50px}
  .top{flex-direction:row;background:none;border:0;border-radius:0;padding:calc(8px + env(safe-area-inset-top)) 8px 0;gap:6px;pointer-events:none;max-width:640px}
  .top>*{pointer-events:auto}
  .top .r1{flex:1.35;min-width:0}
  .badge{display:none}
  .sbox input{min-height:38px;box-shadow:0 1px 6px rgba(0,0,0,.4)}
  #air{flex:1;min-width:0;width:auto;min-height:38px;background:rgba(18,26,34,.94);box-shadow:0 1px 6px rgba(0,0,0,.4)}
  .leaflet-top{top:8px}
  .status{bottom:calc(66px + env(safe-area-inset-bottom));left:60px}
  aside:not([hidden]) ~ .dock, aside:not([hidden]) ~ .fab, aside:not([hidden]) ~ .status{display:none}
  @media (max-width:640px){
    .status{padding:5px 9px;font-size:11px}
    .status .ramp,.status .ramp-l,.status>div:nth-child(2){display:none}
    .leaflet-control-zoom{display:none}
    .call{font-size:26px}
    .pic{width:34%;min-height:84px}
    .grid div{padding:7px 12px}
    .rt2{padding:9px 12px}
    .rp .rc{font-size:26px}
    aside{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:46%}
    input[type=search]{width:150px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="sheet" id="shQ" hidden>
  <h3>Søk</h3>
  <div class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Søk callsign, reg, type" autocomplete="off" aria-label="Søk etter fly"></div>
</div>
<div class="sheet" id="shAir" hidden>
  <h3>Flyselskap</h3>
  <select id="air" aria-label="Flyselskap"><option value="">Alle flyselskap</option></select>
</div>
<div class="sheet" id="shSet" hidden>
  <h3>Innstillinger</h3>
  <label for="src">Datakilde</label>
  <select id="src" aria-label="Datakilde">
    <option value="adsb">adsb.lol</option>
    <option value="airplanes">airplanes.live</option>
    <option value="adsbfi">adsb.fi</option>
    <option value="opensky">OpenSky</option>
  </select>
  <label>Feilsøking</label>
  <button type="button" id="sTest" style="width:100%">Kjør test av kilder og kart</button>
</div>
<div class="sheet" id="shMap" hidden>
  <h3>Karttype</h3>
  <div class="chips2" id="mapChips"></div>
  <select id="mapType" aria-label="Karttype" hidden></select>
  <h3 style="margin-top:14px">Vær</h3>
  <div class="chips2"><button type="button" id="bRadar">Værradar (nedbør)</button></div>
  <div id="radarNote" style="margin-top:6px;font-size:12px;color:var(--mute)" hidden></div>
</div>

<button class="fab" id="bLoc" type="button" aria-label="Min posisjon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></button>
<nav class="dock">
  <button type="button" id="dQ"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Søk</button>
  <button type="button" id="dSet"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Innstillinger</button>
  <button type="button" id="dMap"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Kart</button>
  <button type="button" id="dAir"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>Flyselskap</button>
  <button type="button" id="dSky"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l1.5-2h9L18 8h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>Himmel</button>
</nav>
<button id="diag" type="button" hidden>Test</button>

<aside id="panel" hidden></aside>
<aside id="diagp" hidden style="z-index:700"></aside>

<div id="sky" hidden>
  <video id="skyv" autoplay playsinline muted></video>
  <canvas id="skyc"></canvas>
  <div id="skyinfo"></div>
  <div id="skymsg" class="cmsg" hidden></div>
  <div id="skyadj"><button id="skyL" type="button" aria-label="Juster kompass venstre">◀</button><span>Kompass</span><button id="skyR" type="button" aria-label="Juster kompass høyre">▶</button></div>
  <button id="skyclose" type="button">Tilbake til kart</button>
</div>

<div id="cock" hidden>
  <div id="cmap"></div>
  <canvas id="cpit"></canvas>
  <div class="cattr">Bilder © Esri World Imagery · Terreng: AWS/Mapzen · MapLibre</div>
  <div id="cmsg" class="cmsg" hidden></div>
  <div id="chint" hidden>Snu mobilen til liggende for best utsikt</div>
  <button id="cclose" type="button">Tilbake til kart</button>
</div>

<div class="status">
  <div class="row"><i id="dot"></i><span id="stat">Laster …</span></div>
  <div><div class="ramp"></div><div class="ramp-l"><span>0 ft</span><span>20 000</span><span>40 000 ft</span></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
  'use strict';
  if(typeof L==='undefined'){
    document.body.insertAdjacentHTML('beforeend','<p style="position:absolute;z-index:999;top:70px;left:12px;right:12px;padding:12px;background:#2a1216;border:1px solid #ff6b6b;border-radius:6px">Kartbiblioteket (Leaflet) ble ikke lastet. Sjekk internett, og åpne filen direkte i nettleseren (Chrome/Safari/Firefox), ikke i en forhåndsvisning.</p>');
    return;
  }
  window.addEventListener('error', function(ev){
    var s=document.getElementById('stat'); if(s) s.textContent='Feil: '+ev.message;
  });
  var HOME = [61.3155, 12.2625]; // Trysil
  var PLANE_PATH = 'M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z';

        gs: a.gs==null?null:a.gs, trk: a.track!=null?a.track:(a.true_heading||0),

  // Kildene gir maks 250 nm radius per forespørsel. For store kartutsnitt (Europa) deles utsnittet i flere sirkler.
  function tilesFor(max){
    var c = map.getCenter(), b = map.getBounds();
    var viewNm = c.distanceTo(b.getNorthEast())/1852;
    if(viewNm <= 250) return {tiles:[[c.lat, c.lng, Math.round(Math.max(10, viewNm))]], cut:false};
    var R = 240, side = R*1.852*Math.SQRT2, dLat = side/111.2, tiles = [];
    for(var la = b.getSouth()+dLat/2; la < b.getNorth()+dLat/2; la += dLat){
      var cl = Math.max(0.2, Math.cos(Math.min(Math.abs(la),80)*Math.PI/180)), dLon = side/(111.2*cl);
      for(var lo = b.getWest()+dLon/2; lo < b.getEast()+dLon/2; lo += dLon) tiles.push([la, lo, R]);
    }
    var k = Math.cos(c.lat*Math.PI/180);
    tiles.sort(function(x,y){ return Math.hypot(x[0]-c.lat,(x[1]-c.lng)*k) - Math.hypot(y[0]-c.lat,(y[1]-c.lng)*k); });
    var MAX = max || 1;
    return {tiles:tiles.slice(0, MAX), cut:tiles.length > MAX};
  }

  // Kjører oppgaver med maks n samtidig, så gratis proxyer ikke blir overbelastet
  function pool(items, n, fn){
    return new Promise(function(res){
      var i = 0, active = 0;
      function next(){
        if(i>=items.length && active===0) return res();
        while(active<n && i<items.length){
          active++;
          fn(items[i++]).then(done, done);
        }
      }
      function done(){ active--; next(); }
      next();
    });
  }

  // maxTiles: 1 for gratis offentlige kilder (skånsomt), flere for lokal server
  function adsbSource(name, urlFn, maxTiles){
    return function(signal, probe){
      var t = tilesFor(maxTiles||1), tiles = probe ? [t.tiles[0]] : t.tiles;
      var okCount = 0, lastErr = null, aborted = null, byHex = {}, fb = false;
      function one(x){
        return getJSON(urlFn(x[0].toFixed(3), x[1].toFixed(3), x[2]), signal).then(function(j){
          okCount++;
          normAdsb(j).forEach(function(a){ if(a.hex) byHex[a.hex] = a; });
        }).catch(function(e){ if(e.name==='AbortError') aborted = e; else lastErr = e; });
      }
      return pool(tiles, 3, one).then(function(){
        if(aborted) throw aborted;
        if(!okCount && tiles.length>1){   // alle flisene feilet: prøv bare midten av kartet
          var c = map.getCenter(); fb = true;
          return one([c.lat, c.lng, 240]);
        }
      }).then(function(){
        if(aborted) throw aborted;
        if(!okCount) throw lastErr || new Error('ingen svar');
        if(!probe){
          lastTiles = fb ? 1 : tiles.length;
          lastHint = fb ? ' · bare midten (kilden begrenser)' : (t.cut ? (maxTiles>1 ? ' · zoom inn for flere fly' : ' · kun midten av kartet (egen proxy gir hele Europa)') : (okCount<tiles.length ? ' · delvis dekning' : ''));

        cache.ac.set(d.hex, (j.response && j.response.aircraft) || false);

  // Flyets stilling (nesehøyde og krengning) anslått fra ADS-B-data
  function attitude(d){
    var gs = d.gs || 0, gsm = gs*0.514444;
    var gamma = (gs>40 && d.vr!=null) ? Math.atan((d.vr*0.00508)/gsm)/RAD : 0;
    var aoa = clampN(1.5 + (280-gs)/45, 1.5, 7);
    var pitch = (d.ground && gs<60) ? 0 : gamma + aoa;
    return {pitch: pitch, gamma: gamma};
  }

  function cLayout(){
    var el = $('#cock'), W = el.clientWidth, H = el.clientHeight, port = H > W*1.05;
    var L = {W:W, H:H, port:port};
    L.wy = port ? H*0.47 : H*0.58;             // overkant glareshield = nederkant vindu
    if(port){
      var s = W*0.47, y0 = L.wy + H*0.045;
      L.pfd = {x:W*0.02, y:y0, w:s, h:Math.min(s*1.05, H-y0-H*0.2)};
      L.nd  = {x:W*0.51, y:y0, w:s, h:L.pfd.h};
      L.info = {x:W*0.02, y:y0+L.pfd.h+H*0.012, w:W*0.96, h:Math.max(H*0.07, H-(y0+L.pfd.h+H*0.012)-H*0.012)};
    } else {
      var y1 = L.wy + H*0.04, ph = H - y1 - H*0.025, s2 = Math.min(ph, W*0.27), g = W*0.012;
      var tot = s2*2 + s2*0.85 + g*2, x0 = (W-tot)/2;
      L.pfd = {x:x0, y:y1, w:s2, h:s2};
      L.info = {x:x0+s2+g, y:y1, w:s2*0.85, h:s2};
      L.nd = {x:x0+s2*1.85+g*2, y:y1, w:s2, h:s2};
    }
    // Himmelens utsnitt: vertikal synsvinkel velges slik at vinduet får ca. 70° horisontalt
    var hf = port ? 62 : 72;
    L.vfov = clampN(2*Math.atan(Math.tan(hf*RAD/2)*H/W)/RAD, 38, 110);
    // Horisonten skal ligge ca. 56 % nedover vinduet ved rettlinjet flyging
    var yh = L.wy*0.56;
    L.baseElev = Math.atan(((yh - H/2)/(H/2)) * Math.tan(L.vfov*RAD/2))/RAD;
    return L;
  }

  function cResize(){
    var cv = $('#cpit'), dpr = Math.min(window.devicePixelRatio||1, 2);
    cL = cLayout();
    cv.width = Math.round(cL.W*dpr); cv.height = Math.round(cL.H*dpr);
    cv.style.width = cL.W+'px'; cv.style.height = cL.H+'px';
    cctx = cv.getContext('2d'); cctx.setTransform(dpr,0,0,dpr,0,0);
    if(cmap){ try{ cmap.resize(); cmap.setVerticalFieldOfView(cL.vfov); cmap.triggerRepaint(); }catch(e){} }
    cs && (cs.bg = null);
  }

  function openCockpit(){
    var p = planes.get(sel);
    if(!p) return;
    var el = $('#cock'); el.hidden = false; cockOn = true; cReady = false;
    try{ var re = document.documentElement.requestFullscreen; if(re && !document.fullscreenElement) re.call(document.documentElement).catch(function(){}); }catch(e){}
    try{ screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
    var d = p.d;
    cs = {hdg:d.trk||0, roll:0, pitch:attitude(d).pitch, spd:d.ias!=null?d.ias:(d.gs||0), alt:d.alt||0, vs:d.vr||0, prevHdg:d.trk||0, bg:null};
    var msg = $('#cmsg'); msg.textContent = 'Laster 3D-kart …'; msg.hidden = false;
    cResize();
    loadMapLibre().then(function(){
      if(!cockOn) return;
      if(!cmap){
        cmap = new maplibregl.Map({
          container:'cmap', interactive:false, attributionControl:false, fadeDuration:0, pixelRatio:Math.min(window.devicePixelRatio||1, 1.5),
          center:[p.lon0, p.lat0], zoom:11, pitch:80, bearing:0, maxPitch:120, minPitch:0, canvasContextAttributes:{antialias:false},
          maxTileCacheSize:200,
          style:{
            version:8,
            sources:{
              sat:{type:'raster', tileSize:256, maxzoom:18, attribution:'Esri', tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']},
              dem:{type:'raster-dem', tileSize:256, maxzoom:14, encoding:'terrarium', tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png']}
            },

            terrain:{source:'dem', exaggeration:1},
            sky:{'sky-color':'#3f86d6', 'horizon-color':'#d3e6f4', 'fog-color':'#dbe7ee', 'sky-horizon-blend':0.55, 'horizon-fog-blend':0.8, 'fog-ground-blend':0.55}
          }
        });
        cmap.on('error', function(ev){ cTileT = performance.now(); });
        cmap.once('load', function(){ $('#cmsg').hidden = true; });
      }
      try{ cmap.setVerticalFieldOfView(cL.vfov); }catch(e){}
      cResize();
      cockLoop(performance.now());
    }).catch(function(e){

    });
    if(cL.port){
      var h = $('#chint'); h.hidden = false; setTimeout(function(){ h.hidden = true; }, 5000);
    }
  }

  function closeCockpit(){
    cockOn = false;
    cancelAnimationFrame(cockRaf);
    var c = $('#cock'); if(c) c.hidden = true;
    try{ if(document.fullscreenElement) document.exitFullscreen(); screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); }catch(e){}
  }

  function cockLoop(ts){
    if(!cockOn) return;
    cockRaf = requestAnimationFrame(cockLoop);
    if(ts - cockLast < 40) return;      // ca. 25 bilder i sekundet
    var dt = Math.min(0.2, (ts - cockLast)/1000 || 0.04); cockLast = ts;
    var p = planes.get(sel), msg = $('#cmsg');
    if(!p){ msg.textContent = 'Signalet fra flyet er borte'; msg.hidden = false; return; }
    if(msg.textContent === 'Signalet fra flyet er borte') msg.hidden = true;
    var d = p.d, pos = planePos(p), at = attitude(d);
    // Glatt overgang mellom ADS-B-målingene
    var k = 1 - Math.pow(0.5, dt/0.8);
    var dh = angDiff(cs.hdg, d.trk||0);
    cs.hdg = (cs.hdg + dh*k + 360) % 360;
    var rate = angDiff(cs.prevHdg, cs.hdg)/Math.max(dt, 0.001); cs.prevHdg = cs.hdg;     // grader per sekund
    cs.rate = (cs.rate||0) + (rate - (cs.rate||0))*(1 - Math.pow(0.5, dt/1.2));
    var gsm = (d.gs||0)*0.514444;
    var rollT = d.ground ? 0 : clampN(Math.atan(gsm*cs.rate*RAD/9.81)/RAD, -32, 32);
    if(d.roll!=null && !d.ground) rollT = clampN(d.roll, -40, 40);
    cs.roll += (rollT - cs.roll)*(1 - Math.pow(0.5, dt/0.7));
    cs.pitch += (at.pitch - cs.pitch)*k;
    cs.spd += ((d.ias!=null?d.ias:(d.gs||0)) - cs.spd)*k;
    cs.alt += ((d.ground?(cs.alt):(d.alt||0)) - cs.alt)*k;
    if(d.ground) cs.alt = 0;
    cs.vs += ((d.vr||0) - cs.vs)*k;

    if(cmap && cL){
      try{
        var altM = Math.max(3, (cs.alt||0)*0.3048);
        var ground = null;
        try{ ground = cmap.queryTerrainElevation([pos[1], pos[0]]); }catch(e){}
        if(ground!=null){ altM = Math.max(altM, ground + (d.ground ? 6 : 25)); }
        var wantFlat = (cs.alt||0)*0.3048 > 4000;
        if(wantFlat !== cs.flat){ cs.flat = wantFlat; try{ cmap.setTerrain(wantFlat ? null : {source:'dem', exaggeration:1}); }catch(e){} }
        var elev = cs.pitch + cL.baseElev;                 // kameraets høydevinkel over horisonten
        var co = cmap.calculateCameraOptionsFromCameraLngLatAltRotation([pos[1], pos[0]], altM, cs.hdg, 90 + elev, cs.roll);
        cmap.jumpTo(co);
      }catch(e){ if(!cs.err){ cs.err = 1; msg.textContent = '3D-feil: ' + e.message; msg.hidden = false; } }
    }
    cDraw(d, pos);
  }

  /* ----- Tegning av cockpit ----- */
  function rr(c, x, y, w, h, r){
    c.beginPath(); c.moveTo(x+r, y); c.lineTo(x+w-r, y); c.quadraticCurveTo(x+w, y, x+w, y+r); c.lineTo(x+w, y+h-r);
    c.quadraticCurveTo(x+w, y+h, x+w-r, y+h); c.lineTo(x+r, y+h); c.quadraticCurveTo(x, y+h, x, y+h-r); c.lineTo(x, y+r); c.quadraticCurveTo(x, y, x+r, y);
    c.closePath();
  }
  function windowPath(c, L, keep){
    var W = L.W, H = L.H, tx = L.port ? 0.05 : 0.10, bx = L.port ? -0.01 : 0.012;
    if(!keep) c.beginPath();
    c.moveTo(W*tx, H*0.04);
    c.quadraticCurveTo(W*0.5, -H*0.012, W*(1-tx), H*0.04);
    c.lineTo(W*(1-bx), L.wy); c.lineTo(W*bx, L.wy); c.closePath();
  }
  function drawFrame(c, L){
    var W = L.W, H = L.H, g;
    // Karm rundt vinduet
    c.save();
    c.beginPath(); c.rect(0, 0, W, H); windowPath(c, L, true);
    g = c.createLinearGradient(0, 0, 0, L.wy); g.addColorStop(0, '#0e1116'); g.addColorStop(1, '#1b2027');
    c.fillStyle = g; c.fill('evenodd');
    c.restore();
    // Midtstolpe
    c.save(); windowPath(c, L); c.clip();
    var pw = Math.max(8, W*0.016);
    g = c.createLinearGradient(W/2-pw/2, 0, W/2+pw/2, 0); g.addColorStop(0, '#1a1f26'); g.addColorStop(.5, '#2c333c'); g.addColorStop(1, '#14181d');
    c.fillStyle = g; c.fillRect(W/2-pw/2, 0, pw, L.wy);
    // Svak refleksjon og kantmørkning i glasset
    var rg = c.createRadialGradient(W/2, L.wy*.55, Math.min(W, L.wy)*0.3, W/2, L.wy*.55, Math.max(W, L.wy)*0.75);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.38)');
    c.fillStyle = rg; c.fillRect(0, 0, W, L.wy);
    var lg = c.createLinearGradient(0, 0, W*0.6, L.wy);
    lg.addColorStop(0, 'rgba(255,255,255,.07)'); lg.addColorStop(.35, 'rgba(255,255,255,0)');
    c.fillStyle = lg; c.fillRect(0, 0, W, L.wy);
    c.restore();
    // Skarp innerkant
    windowPath(c, L); c.lineWidth = 2; c.strokeStyle = '#3b434e'; c.stroke();
    // Vindusviskere (parkert)
    c.strokeStyle = '#0b0d10'; c.lineWidth = Math.max(3, W*.004); c.lineCap = 'round';
    c.beginPath(); c.moveTo(W*.40, L.wy); c.lineTo(W*.27, L.wy - H*.075); c.stroke();
    c.beginPath(); c.moveTo(W*.74, L.wy); c.lineTo(W*.61, L.wy - H*.075); c.stroke();
    // Overheadpanel (topp) med noen lys
    g = c.createLinearGradient(0, 0, 0, H*0.04); g.addColorStop(0, '#0a0c10'); g.addColorStop(1, '#161a20');
    c.fillStyle = g; c.fillRect(0, 0, W, H*0.012);
    // Glareshield
    var gy = L.wy;
    c.save();
    g = c.createLinearGradient(0, gy-2, 0, gy + H*0.045);
    g.addColorStop(0, '#323943'); g.addColorStop(.18, '#262c34'); g.addColorStop(1, '#14181d');
    c.fillStyle = g; c.fillRect(0, gy-1, W, H-gy+1);
    c.fillStyle = '#0a0d11'; c.fillRect(0, gy + H*0.028, W, 2);
    // Lysknapper på glareshield
    var bw = W*0.028, bh = H*0.012, bx0 = W*0.5 - bw*4.5;
    for(var i=0; i<9; i++){
      rr(c, bx0 + i*bw, gy + H*0.008, bw*.78, bh, 2);
      c.fillStyle = (i%3===1) ? '#4a3a1c' : '#202630'; c.fill();
      c.fillStyle = (i%3===1) ? '#ffb454' : '#52606f'; c.fillRect(bx0 + i*bw + bw*.12, gy + H*0.008 + bh*.35, bw*.5, 1.5);
    }
    c.restore();
    // Instrumentpanel-bakgrunn
    g = c.createLinearGradient(0, gy + H*0.045, 0, H); g.addColorStop(0, '#171b21'); g.addColorStop(1, '#0d1014');
    c.fillStyle = g; c.fillRect(0, gy + H*0.045, W, H);
  }

  function bezel(c, r){
    c.save();
    rr(c, r.x-4, r.y-4, r.w+8, r.h+8, 7); c.fillStyle = '#080a0d'; c.fill();
    c.lineWidth = 1.5; c.strokeStyle = '#2d343d'; c.stroke();
    c.restore();
  }
  function pad3(n){ n = Math.round(((n%360)+360)%360); return String(n===0?360:n).padStart(3, '0'); }

  function drawPFD(c, r, d){
    bezel(c, r);
    c.save(); rr(c, r.x, r.y, r.w, r.h, 4); c.clip();
    var cx = r.x + r.w*0.5, cy = r.y + r.h*0.46, ppd = r.h/30, fs = Math.max(9, r.h/17);
    // Kunstig horisont
    c.save(); c.translate(cx, cy); c.rotate(cs.roll*RAD); c.translate(0, cs.pitch*ppd);
    c.fillStyle = '#2a79d4'; c.fillRect(-r.w*2, -r.h*3, r.w*4, r.h*3);
    c.fillStyle = '#7a5130'; c.fillRect(-r.w*2, 0, r.w*4, r.h*3);
    c.fillStyle = '#fff'; c.fillRect(-r.w*2, -1, r.w*4, 2);
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.5; c.font = '600 ' + (fs*.85) + 'px ' + 'ui-monospace,Menlo,monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
    for(var a=-30; a<=30; a+=2.5){
      if(a===0) continue;
      var big = a%10===0, mid = a%5===0, hw = big ? r.w*.13 : (mid ? r.w*.08 : r.w*.04);
      c.beginPath(); c.moveTo(-hw, -a*ppd); c.lineTo(hw, -a*ppd); c.stroke();
      if(big){ c.fillText(String(Math.abs(a)), -hw-fs*.9, -a*ppd); c.fillText(String(Math.abs(a)), hw+fs*.9, -a*ppd); }
    }
    c.restore();
    // Rullskala
    c.save(); c.translate(cx, cy); c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 1.5;
    var R = r.h*.36;
    c.beginPath(); c.arc(0, 0, R, (-150)*RAD, (-30)*RAD); c.stroke();
    [-60,-45,-30,-20,-10,0,10,20,30,45,60].forEach(function(t){
      var an = (-90 + t)*RAD, l = (t%30===0 || t===0) ? 9 : 5;
      c.beginPath(); c.moveTo(Math.cos(an)*R, Math.sin(an)*R); c.lineTo(Math.cos(an)*(R-l), Math.sin(an)*(R-l)); c.stroke();
    });
    c.rotate(cs.roll*RAD);
    c.beginPath(); c.moveTo(0, -R+1); c.lineTo(-6, -R+11); c.lineTo(6, -R+11); c.closePath(); c.fillStyle = '#ffd24a'; c.fill();
    c.restore();
    // Flysymbol
    c.save(); c.translate(cx, cy); c.strokeStyle = '#ffd24a'; c.lineWidth = 3; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-r.w*.22, 0); c.lineTo(-r.w*.08, 0); c.lineTo(-r.w*.08, 7); c.stroke();
    c.beginPath(); c.moveTo(r.w*.22, 0); c.lineTo(r.w*.08, 0); c.lineTo(r.w*.08, 7); c.stroke();
    c.fillStyle = '#ffd24a'; c.fillRect(-2, -2, 4, 4);
    c.restore();
    // Fartstape (venstre)
    var tw = r.w*.2, mono = 'ui-monospace,Menlo,monospace';
    c.fillStyle = 'rgba(8,12,18,.62)'; c.fillRect(r.x, r.y + r.h*.08, tw, r.h*.7);
    c.save(); c.beginPath(); c.rect(r.x, r.y + r.h*.08, tw, r.h*.7); c.clip();
    var sp = cs.spd, pk = r.h*.7/64;
    c.fillStyle = '#fff'; c.strokeStyle = '#fff'; c.lineWidth = 1.2; c.textAlign = 'left'; c.font = '600 ' + (fs*.85) + 'px ' + mono; c.textBaseline = 'middle';
    for(var t = Math.floor((sp-34)/10)*10; t <= sp+34; t += 10){
      if(t < 0) continue;
      var y = cy - (t - sp)*pk;
      c.beginPath(); c.moveTo(r.x+tw, y); c.lineTo(r.x+tw-(t%20===0?9:5), y); c.stroke();
      if(t%20===0) c.fillText(String(t), r.x+3, y);
    }
    c.restore();
    c.fillStyle = '#000'; c.fillRect(r.x, cy-fs*.8, tw+2, fs*1.6);
    c.strokeStyle = '#ffd24a'; c.lineWidth = 1.5; c.strokeRect(r.x+.5, cy-fs*.8, tw+1, fs*1.6);
    c.fillStyle = '#3ddc84'; c.font = '700 ' + fs + 'px ' + mono; c.textAlign = 'center'; c.fillText(String(Math.max(0, Math.round(sp))), r.x + tw/2, cy);
    // Høydetape (høyre)
    var ax = r.x + r.w - tw;
    c.fillStyle = 'rgba(8,12,18,.62)'; c.fillRect(ax, r.y + r.h*.08, tw, r.h*.7);
    c.save(); c.beginPath(); c.rect(ax, r.y + r.h*.08, tw, r.h*.7); c.clip();
    var al = cs.alt, pa = r.h*.7/820;
    c.fillStyle = '#fff'; c.strokeStyle = '#fff'; c.textAlign = 'right'; c.font = '600 ' + (fs*.8) + 'px ' + mono;
    for(var t2 = Math.floor((al-460)/100)*100; t2 <= al+460; t2 += 100){
      var y2 = cy - (t2 - al)*pa;
      c.beginPath(); c.moveTo(ax, y2); c.lineTo(ax+(t2%200===0?9:5), y2); c.stroke();
      if(t2%200===0) c.fillText(String(t2), r.x+r.w-3, y2);
    }
    c.restore();
    c.fillStyle = '#000'; c.fillRect(ax-2, cy-fs*.8, tw+2, fs*1.6);
    c.strokeStyle = '#ffd24a'; c.strokeRect(ax-1.5, cy-fs*.8, tw+1, fs*1.6);
    c.fillStyle = '#3ddc84'; c.font = '700 ' + (fs*.95) + 'px ' + mono; c.textAlign = 'center'; c.fillText(d.ground ? 'GND' : String(Math.round(al/10)*10), ax + tw/2, cy);
    // Vertikal fart
    c.fillStyle = '#fff'; c.font = '600 ' + (fs*.8) + 'px ' + mono; c.textAlign = 'right';
    c.fillText((cs.vs>=0?'+':'') + Math.round(cs.vs/100)*100, r.x+r.w-3, r.y + r.h*.84);
    c.fillStyle = '#9fb0c0'; c.textAlign = 'left'; c.fillText('V/S', ax-2-fs*2.2, r.y + r.h*.84);
    // Kurstape (bunn)
    var hy = r.y + r.h*.88, hh = r.h*.12;
    c.fillStyle = 'rgba(8,12,18,.75)'; c.fillRect(r.x, hy, r.w, hh + 2);
    c.save(); c.beginPath(); c.rect(r.x, hy, r.w, hh); c.clip();
    var pdg = r.w/60;
    c.fillStyle = '#fff'; c.strokeStyle = '#fff'; c.textAlign = 'center'; c.font = '600 ' + (fs*.75) + 'px ' + mono; c.textBaseline = 'middle';
    for(var h5 = Math.floor((cs.hdg-32)/5)*5; h5 <= cs.hdg+32; h5 += 5){
      var x = cx + (h5 - cs.hdg)*pdg, hv = ((h5%360)+360)%360;
      c.beginPath(); c.moveTo(x, hy); c.lineTo(x, hy + (hv%10===0 ? hh*.38 : hh*.2)); c.stroke();
      if(hv%10===0) c.fillText(String(hv/10).padStart(2,'0'), x, hy + hh*.68);
    }
    c.restore();
    c.fillStyle = '#ffd24a'; c.beginPath(); c.moveTo(cx, hy); c.lineTo(cx-5, hy-7); c.lineTo(cx+5, hy-7); c.closePath(); c.fill();
    c.fillStyle = '#000'; c.fillRect(cx-fs*1.5, hy-fs*1.5, fs*3, fs*1.15);
    c.fillStyle = '#3ddc84'; c.font = '700 ' + (fs*.9) + 'px ' + mono; c.textBaseline = 'middle'; c.fillText(pad3(cs.hdg)+'°', cx, hy-fs*.92);
    c.restore();
  }

  function nearNm(range){ var L = [10,20,40,80,160,320]; for(var i=0;i<L.length;i++) if(L[i]>=range) return L[i]; return 320; }
  function bearing(a, b, c2, d2){
    var t = RAD, y = Math.sin((d2-b)*t)*Math.cos(c2*t), x = Math.cos(a*t)*Math.sin(c2*t) - Math.sin(a*t)*Math.cos(c2*t)*Math.cos((d2-b)*t);
    return (Math.atan2(y, x)/t + 360) % 360;
  }

  function drawND(c, r, d, pos){
    bezel(c, r);
    c.save(); rr(c, r.x, r.y, r.w, r.h, 4); c.clip();
    c.fillStyle = '#02050a'; c.fillRect(r.x, r.y, r.w, r.h);
    var mono = 'ui-monospace,Menlo,monospace', fs = Math.max(9, r.h/18);
    var cx = r.x + r.w/2, cy = r.y + r.h*.8, R = Math.min(r.w*.47, r.h*.66);
    var rt = d.call ? cache.route.get(d.call) : null, dest = rt && rt.destination && rt.destination.latitude!=null ? rt.destination : null, org = rt && rt.origin && rt.origin.latitude!=null ? rt.origin : null;
    var dDest = dest ? km(pos[0], pos[1], dest.latitude, dest.longitude)/1.852 : null;
    var range = dDest!=null ? nearNm(dDest*1.05) : 40; if(range < 20) range = 20;
    var ppn = R/range;
    // Kompassring
    c.save(); c.translate(cx, cy); c.lineWidth = 1.2;
    c.strokeStyle = '#d8e2ec'; c.fillStyle = '#d8e2ec'; c.font = '600 ' + (fs*.85) + 'px ' + mono; c.textAlign = 'center'; c.textBaseline = 'middle';
    for(var a=0; a<360; a+=5){

  }

  function skyLoop(ts){
    if(!skyOn) return;
    skyRaf = requestAnimationFrame(skyLoop);
    if(ts - skyLast < 40) return; skyLast = ts;
    var cv = $('#skyc'), W = window.innerWidth, H = window.innerHeight, dpr = Math.min(window.devicePixelRatio||1, 2);
    if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.width = W+'px'; cv.style.height = H+'px'; skyCtx = cv.getContext('2d'); }
    var c = skyCtx; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
    var info = $('#skyinfo'), msg = $('#skymsg');
    if(!skyObs){ msg.textContent = 'Finner posisjonen din …'; msg.hidden = false; return; }
    if(!skyOri){ msg.textContent = (ts - skyT0 > 3000) ? (skyDenied ? 'Tillat bevegelse og retning (sensorer) for dette nettstedet i nettleserinnstillingene.' : 'Får ikke kompass fra telefonen. Beveg mobilen i en åtte-figur.') : 'Henter kompass …'; msg.hidden = false; return; }
    msg.hidden = true;
    var B = skyBasis(), foc = Math.max(W, H)/2/Math.tan(33*RAD);       // ca. 66° synsvinkel langs lengste side
    var hdg = (Math.atan2(B.f[0], B.f[1])/RAD + 360 + skyOff) % 360, elv = Math.asin(clampN(B.f[2], -1, 1))/RAD;
    var list = [], seen = 0;
    planes.forEach(function(p){
      var t = skyTarget(p); if(!t || t.el < -2) return;
      list.push(t);
    });
    list.sort(function(a, b){ return a.dist - b.dist; });
    var out = [];
    c.textBaseline = 'middle';
    list.forEach(function(t){
      var v = skyDir(t.az, t.el), zc = dot3(v, B.f), xc = dot3(v, B.r), yc = dot3(v, B.u);
      var px = W/2 + (zc > 0.05 ? xc/zc*foc : 0), py = H/2 - (zc > 0.05 ? yc/zc*foc : 0);
      var inside = zc > 0.05 && px > -20 && px < W+20 && py > -20 && py < H+20;
      if(!inside){ out.push({t:t, x:xc, y:yc}); return; }
      seen++;
      var d = t.p.d, rt = d.call ? cache.route.get(d.call) : null;
      var l1 = (d.call || d.hex.toUpperCase()) + (rt && rt.destination ? '  → ' + (rt.destination.iata_code||'') : '');
      var l2 = (d.alt!=null ? 'FL'+String(Math.round(d.alt/100)).padStart(3,'0') : '') + ' · ' + nb(t.dist/1000) + ' km' + (d.type ? ' · ' + d.type : '');
      c.strokeStyle = '#ffd24a'; c.lineWidth = 2; c.beginPath(); c.arc(px, py, 14, 0, 7); c.stroke();
      c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(px, py, 2.5, 0, 7); c.fill();
      c.font = '700 14px ui-monospace,Menlo,monospace'; var w1 = c.measureText(l1).width;
      c.font = '500 12px ui-monospace,Menlo,monospace'; var w2 = c.measureText(l2).width, bw = Math.max(w1, w2) + 14, bx = Math.min(W - bw - 4, px + 20), by = py - 22;
      c.fillStyle = 'rgba(8,14,20,.72)'; rr(c, bx, by, bw, 40, 6); c.fill();
      c.fillStyle = '#fff'; c.font = '700 14px ui-monospace,Menlo,monospace'; c.textAlign = 'left'; c.fillText(l1, bx+7, by+12);
      c.fillStyle = '#9fd8ff'; c.font = '500 12px ui-monospace,Menlo,monospace'; c.fillText(l2, bx+7, by+29);
    });
    // Piler mot nærmeste fly utenfor bildet
    out.slice(0, 3).forEach(function(o){
      var ang = Math.atan2(-o.y, o.x), m = 34, ex = W/2 + Math.cos(ang)*(W/2 - m), ey = H/2 + Math.sin(ang)*(H/2 - m);
      var k = Math.min((W/2 - m)/Math.max(1e-3, Math.abs(Math.cos(ang))), (H/2 - m)/Math.max(1e-3, Math.abs(Math.sin(ang))));
      ex = W/2 + Math.cos(ang)*k; ey = H/2 + Math.sin(ang)*k;
      c.save(); c.translate(ex, ey); c.rotate(ang);
      c.fillStyle = 'rgba(255,210,74,.92)'; c.beginPath(); c.moveTo(16, 0); c.lineTo(-8, 10); c.lineTo(-8, -10); c.closePath(); c.fill(); c.restore();
      var d = o.t.p.d; c.font = '600 12px ui-monospace,Menlo,monospace'; c.fillStyle = '#fff'; c.textAlign = 'center';
      c.strokeStyle = 'rgba(0,0,0,.8)'; c.lineWidth = 3; var s = (d.call || d.hex.toUpperCase()) + ' ' + nb(o.t.dist/1000) + ' km';
      var tx = clampN(ex - Math.cos(ang)*40, 60, W-60), ty = clampN(ey - Math.sin(ang)*22, 14, H-14); c.strokeText(s, tx, ty); c.fillText(s, tx, ty);
    });
    var dirs = ['N','NØ','Ø','SØ','S','SV','V','NV'];
    info.textContent = 'Retning ' + Math.round(hdg) + '° ' + dirs[Math.round(hdg/45)%8] + ' · Høyde ' + Math.round(elv) + '° · ' + seen + ' fly i bildet' + (list.length ? ' (' + list.length + ' over horisonten)' : '');
  }
  var skyFilter = false, skyDenied = false;

  function skyStop(){
    skyOn = false; cancelAnimationFrame(skyRaf);
    window.removeEventListener('deviceorientationabsolute', skyOrient, true);
    window.removeEventListener('deviceorientation', skyOrient, true);
    if(skyWatch!=null){ try{ navigator.geolocation.clearWatch(skyWatch); }catch(e){} skyWatch = null; }
    if(skyStream){ skyStream.getTracks().forEach(function(t){ t.stop(); }); skyStream = null; }
    var v = $('#skyv'); if(v) v.srcObject = null;
    $('#sky').hidden = true;
  }

  function skyStart(){
    if(skyOn) return;
    var el = $('#sky'), msg = $('#skymsg'); el.hidden = false; skyOn = true; skyOri = null; skyT0 = performance.now(); skyLast = 0;
    msg.textContent = 'Starter …'; msg.hidden = false;
    var ask = (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') ? DeviceOrientationEvent.requestPermission().catch(function(){ return 'denied'; }) : Promise.resolve('granted');
    ask.then(function(st){
      skyDenied = (st !== 'granted');
      window.addEventListener('deviceorientationabsolute', skyOrient, true);
      window.addEventListener('deviceorientation', skyOrient, true);
      if(navigator.geolocation){
        skyWatch = navigator.geolocation.watchPosition(function(pos){
          var first = !skyObs;
          skyObs = {lat:pos.coords.latitude, lon:pos.coords.longitude, alt:pos.coords.altitude || 0};
          if(first){ try{ map.setView([skyObs.lat, skyObs.lon], 8, {animate:false}); }catch(e){} }
        }, function(){ msg.textContent = 'Får ikke tilgang til posisjonen din. Tillat posisjon for nettstedet.'; msg.hidden = false; }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
      } else { msg.textContent = 'Posisjon støttes ikke i denne nettleseren.'; }
      var cam = navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false}) : Promise.reject(new Error('nocam'));
      return cam.then(function(s){
        if(!skyOn){ s.getTracks().forEach(function(t){ t.stop(); }); return; }
        skyStream = s; var v = $('#skyv'); v.srcObject = s; v.play && v.play().catch(function(){});
      }, function(){ /* uten kamera: vis bare markørene på mørk bakgrunn */ $('#skyv').style.display = 'none'; });
    }).then(function(){ if(skyOn) skyLoop(performance.now()); });
  }
  $('#dSky').onclick = function(){ closeSheets(); skyStart(); };
  $('#skyclose').onclick = skyStop;
  $('#skyL').onclick = function(){ skyOff -= 3; };
  $('#skyR').onclick = function(){ skyOff += 3; };

  $('#q').addEventListener('input', function(e){ filter = e.target.value.trim().toLowerCase(); redrawAll(); });
  $('#src').addEventListener('change', function(e){
    src = e.target.value;
    planes.forEach(function(p){ if(p.marker) p.marker.remove(); });
    planes.clear(); select(null); fails = 0; tick();
  });

  autoPick();
})();
</script>
</body>
